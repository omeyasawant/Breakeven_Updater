name: Build Breakeven_Updater Distributables

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_suffix: windows
            upload_path: dist/Breakeven_Updater.exe

          - os: ubuntu-latest
            artifact_suffix: linux
            upload_path: dist/Breakeven_Updater-x86_64.AppImage

          - os: macos-15-intel
            artifact_suffix: macos
            upload_path: dist/Breakeven_Updater.pkg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: breakeven-updater
          python-version: "3.11"
          channels: conda-forge
          channel-priority: strict
          auto-update-conda: true

      - name: Report macOS compatibility target
        if: runner.os == 'macOS'
        shell: bash -l {0}
        run: |
          python --version
          echo "Runner architecture: $(uname -m)"
          PYTHON_BIN="$(python -c 'import sys; print(sys.executable)')"
          echo "Using Python at $PYTHON_BIN"
          echo "::warning::Current macOS dependency set is not universal2-capable. Building an x86_64 app for Intel and Apple Silicon via Rosetta."

      - name: Install core dependencies (conda)
        shell: bash -l {0}
        run: |
          conda install -y             python="3.11"             setuptools             pip

      - name: Install pip dependencies
        shell: bash -l {0}
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.3.0

      - name: Configure macOS code signing
        if: runner.os == 'macOS'
        shell: bash -l {0}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_BUILD_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_INSTALLER_SIGNING_IDENTITY: ${{ secrets.APPLE_INSTALLER_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          echo "MACOS_SIGNING_ENABLED=false" >> "$GITHUB_ENV"
          echo "MACOS_PKG_SIGNING_ENABLED=false" >> "$GITHUB_ENV"
          echo "MACOS_NOTARIZATION_ENABLED=false" >> "$GITHUB_ENV"

          missing=()
          for var in BUILD_CERTIFICATE_BASE64 P12_PASSWORD KEYCHAIN_PASSWORD APPLE_SIGNING_IDENTITY APPLE_INSTALLER_SIGNING_IDENTITY APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!var:-}" ]; then
              missing+=("$var")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::macOS Developer ID signing/notarization secrets missing (${missing[*]}). Refusing to build an unsigned/non-notarized release."
            exit 1
          fi

          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          if ! printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH" 2>/dev/null; then
            printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          fi

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -d user -s "$KEYCHAIN_PATH"

          echo "== Imported identities =="
          security find-identity -v "$KEYCHAIN_PATH"
          if ! security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -F "$APPLE_SIGNING_IDENTITY"; then
            echo "::error::APPLE_SIGNING_IDENTITY ('$APPLE_SIGNING_IDENTITY') not found among imported identities."
            exit 1
          fi
          if ! security find-identity -v "$KEYCHAIN_PATH" | grep -F "$APPLE_INSTALLER_SIGNING_IDENTITY"; then
            echo "::error::APPLE_INSTALLER_SIGNING_IDENTITY ('$APPLE_INSTALLER_SIGNING_IDENTITY') not found among imported identities."
            exit 1
          fi

          echo "MACOS_SIGNING_ENABLED=true" >> "$GITHUB_ENV"
          echo "MACOS_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "MACOS_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          echo "MACOS_PKG_SIGNING_ENABLED=true" >> "$GITHUB_ENV"
          echo "MACOS_PKG_SIGNING_IDENTITY=$APPLE_INSTALLER_SIGNING_IDENTITY" >> "$GITHUB_ENV"

          echo "MACOS_NOTARIZATION_ENABLED=true" >> "$GITHUB_ENV"

      - name: Build (Windows .exe)
        if: runner.os == 'Windows'
        shell: bash -l {0}
        run: |
          python -m PyInstaller --onefile updater.py             --name Breakeven_Updater             --hidden-import psutil             --hidden-import requests             --hidden-import packaging

      - name: Build (macOS .pkg)
        if: runner.os == 'macOS'
        shell: bash -l {0}
        run: |
          echo "::notice::Building Breakeven_Updater as x86_64 (Intel + Apple Silicon via Rosetta); universal2 dependency set is not yet available."

          if [ "${MACOS_SIGNING_ENABLED:-false}" != "true" ] || [ "${MACOS_PKG_SIGNING_ENABLED:-false}" != "true" ]; then
            echo "::error::Developer ID signing is required but not enabled. The signing configuration step should have failed."
            exit 1
          fi

          cat > build-macos-entitlements.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.cs.allow-jit</key>
            <true/>
            <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
            <true/>
            <key>com.apple.security.cs.disable-library-validation</key>
            <true/>
          </dict>
          </plist>
          EOF

          PYINSTALLER_MAC_ARGS=(
            --target-arch x86_64
            --osx-bundle-identifier com.breakeven.updater
            --codesign-identity "$MACOS_SIGNING_IDENTITY"
            --osx-entitlements-file "$PWD/build-macos-entitlements.plist"
          )

          # Build an x86_64 app bundle (runs on Intel and on Apple Silicon via Rosetta)
          python -m PyInstaller --onedir --windowed updater.py             --name Breakeven_Updater             --hidden-import psutil             --hidden-import requests             --hidden-import packaging             "${PYINSTALLER_MAC_ARGS[@]}"

          echo "== Verifying Breakeven_Updater.app signature =="
          codesign --verify --deep --strict --verbose=2 "dist/Breakeven_Updater.app"
          codesign -dv --verbose=2 "dist/Breakeven_Updater.app" 2>&1 | grep -E "Authority|TeamIdentifier" || true

          PACKAGE_VERSION="${BREAKEVEN_PKG_VERSION:-1.0.0}"

          pkgbuild             --component "dist/Breakeven_Updater.app"             --install-location "/Library/Application Support/BreakEvenClient/client_service"             --identifier "com.breakeven.updater.pkg"             --version "$PACKAGE_VERSION"             --sign "$MACOS_PKG_SIGNING_IDENTITY"             "dist/Breakeven_Updater.pkg"

          echo "== Verifying Breakeven_Updater.pkg signature =="
          pkgutil --check-signature "dist/Breakeven_Updater.pkg"

      - name: Notarize macOS package
        if: runner.os == 'macOS'
        shell: bash -l {0}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "${MACOS_NOTARIZATION_ENABLED:-false}" != "true" ]; then
            echo "::error::Notarization prerequisites are unavailable. The signing configuration step should have failed."
            exit 1
          fi

          xcrun notarytool submit "dist/Breakeven_Updater.pkg"             --apple-id "$APPLE_ID"             --password "$APPLE_APP_SPECIFIC_PASSWORD"             --team-id "$APPLE_TEAM_ID"             --wait

          xcrun stapler staple "dist/Breakeven_Updater.pkg"

          echo "== Validating stapled notarization ticket =="
          validate_ok=false
          for attempt in 1 2 3 4 5; do
            if xcrun stapler validate "dist/Breakeven_Updater.pkg"; then
              validate_ok=true
              break
            fi
            echo "::warning::stapler validate attempt $attempt failed (possible transient Apple CloudKit network error). Retrying in 15s..."
            sleep 15
          done
          if [ "$validate_ok" != "true" ]; then
            echo "::warning::stapler validate could not reach Apple's ticket service, but notarization returned 'Accepted' and 'staple' succeeded, so the ticket is already stapled to the .pkg. Continuing."
          fi

      - name: Clean up macOS signing keychain
        if: runner.os == 'macOS' && always()
        shell: bash -l {0}
        run: |
          if [ -n "${MACOS_KEYCHAIN_PATH:-}" ] && [ -f "$MACOS_KEYCHAIN_PATH" ]; then
            security delete-keychain "$MACOS_KEYCHAIN_PATH" || true
          fi

      - name: Build (Linux AppImage)
        if: runner.os == 'Linux'
        shell: bash -l {0}
        run: |
          python -m PyInstaller --onefile updater.py             --name Breakeven_Updater             --hidden-import psutil             --hidden-import requests             --hidden-import packaging

          # Create AppDir layout
          rm -rf AppDir
          mkdir -p AppDir/usr/bin
          cp dist/Breakeven_Updater AppDir/usr/bin/Breakeven_Updater

          # Desktop entry
          cat > AppDir/Breakeven_Updater.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=Breakeven Updater
          Exec=Breakeven_Updater
          Icon=Breakeven_Updater
          Categories=Utility;
          Terminal=true
          EOF

          # Minimal 1x1 PNG icon (base64)
          base64 -d > AppDir/Breakeven_Updater.png << 'EOF'
          iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVQImWNgYGD4DwABBAEAHnLrWQAAAABJRU5ErkJggg==
          EOF

          # AppRun launcher
          cat > AppDir/AppRun << 'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/Breakeven_Updater" "$@"
          EOF
          chmod +x AppDir/AppRun

          # Package AppImage
          curl -L -o appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool

          # Extract appimagetool (NO FUSE required)
          ./appimagetool --appimage-extract

          # Run the extracted binary
          ./squashfs-root/AppRun AppDir dist/Breakeven_Updater-x86_64.AppImage

          chmod +x dist/Breakeven_Updater-x86_64.AppImage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Breakeven_Updater-${{ matrix.artifact_suffix }}
          path: ${{ matrix.upload_path }}
