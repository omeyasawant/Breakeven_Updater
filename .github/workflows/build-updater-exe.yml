name: Build Breakeven_Updater Distributables

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_suffix: windows
            upload_path: dist/Breakeven_Updater.exe

          - os: ubuntu-latest
            artifact_suffix: linux
            upload_path: dist/Breakeven_Updater-x86_64.AppImage

          - os: macos-latest
            artifact_suffix: macos
            upload_path: dist/Breakeven_Updater.app.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Miniconda
        if: runner.os != 'macOS'
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: breakeven-updater
          python-version: "3.11"
          channels: conda-forge
          channel-priority: strict
          auto-update-conda: true

      - name: Setup Python (macOS universal2)
        if: runner.os == 'macOS'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify macOS Python is universal2
        if: runner.os == 'macOS'
        shell: bash -l {0}
        run: |
          PYTHON_BIN="$(python -c 'import sys; print(sys.executable)')"
          echo "Using Python at $PYTHON_BIN"
          LIPO_INFO="$(lipo -info "$PYTHON_BIN" 2>/dev/null || file "$PYTHON_BIN")"
          echo "$LIPO_INFO"
          if [[ "$LIPO_INFO" != *"arm64"* || "$LIPO_INFO" != *"x86_64"* ]]; then
            echo "::error::The macOS Python interpreter is not universal2. Cannot produce a universal app bundle."
            exit 1
          fi

      - name: Install core dependencies (conda)
        if: runner.os != 'macOS'
        shell: bash -l {0}
        run: |
          conda install -y             python="3.11"             setuptools             pip

      - name: Install pip dependencies
        shell: bash -l {0}
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            export ARCHFLAGS="-arch arm64 -arch x86_64"
            export MACOSX_DEPLOYMENT_TARGET=11.0
          fi
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pyinstaller==6.3.0

      - name: Configure macOS code signing
        if: runner.os == 'macOS'
        shell: bash -l {0}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_BUILD_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          echo "MACOS_SIGNING_ENABLED=false" >> "$GITHUB_ENV"
          echo "MACOS_NOTARIZATION_ENABLED=false" >> "$GITHUB_ENV"

          missing=()
          for var in BUILD_CERTIFICATE_BASE64 P12_PASSWORD KEYCHAIN_PASSWORD APPLE_SIGNING_IDENTITY; do
            if [ -z "${!var:-}" ]; then
              missing+=("$var")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::warning::macOS Developer ID signing secrets missing (${missing[*]}). Building ad-hoc signed universal app."
            exit 0
          fi

          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          if ! printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH" 2>/dev/null; then
            printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          fi

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -d user -s "$KEYCHAIN_PATH"

          echo "MACOS_SIGNING_ENABLED=true" >> "$GITHUB_ENV"
          echo "MACOS_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "MACOS_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
            echo "MACOS_NOTARIZATION_ENABLED=true" >> "$GITHUB_ENV"
          else
            echo "::warning::Apple notarization secrets missing (APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, or APPLE_TEAM_ID). App will be Developer ID signed but not notarized."
          fi

      - name: Build (Windows .exe)
        if: runner.os == 'Windows'
        shell: bash -l {0}
        run: |
          python -m PyInstaller --onefile updater.py             --name Breakeven_Updater             --hidden-import psutil             --hidden-import requests             --hidden-import packaging

      - name: Build (macOS .app zip)
        if: runner.os == 'macOS'
        shell: bash -l {0}
        run: |
          export ARCHFLAGS="-arch arm64 -arch x86_64"
          export MACOSX_DEPLOYMENT_TARGET=11.0

          cat > build-macos-entitlements.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.cs.allow-jit</key>
            <true/>
            <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
            <true/>
            <key>com.apple.security.cs.disable-library-validation</key>
            <true/>
          </dict>
          </plist>
          EOF

          PYINSTALLER_MAC_ARGS=(
            --target-arch universal2
            --osx-bundle-identifier com.breakeven.updater
          )

          if [ "${MACOS_SIGNING_ENABLED:-false}" = "true" ]; then
            PYINSTALLER_MAC_ARGS+=(
              --codesign-identity "$MACOS_SIGNING_IDENTITY"
              --osx-entitlements-file "$PWD/build-macos-entitlements.plist"
            )
          else
            echo "::warning::Building Breakeven_Updater with PyInstaller ad-hoc signing because Developer ID secrets were not provided."
          fi

          # Build a universal app bundle (onedir on macOS produces dist/Breakeven_Updater.app)
          python -m PyInstaller --onedir --windowed updater.py             --name Breakeven_Updater             --hidden-import psutil             --hidden-import requests             --hidden-import packaging             "${PYINSTALLER_MAC_ARGS[@]}"

          python - << 'PY'
          import os
          import subprocess
          import sys

          bundle_root = os.path.join("dist", "Breakeven_Updater.app")
          invalid = []
          for root, _, files in os.walk(bundle_root):
            for name in files:
              file_path = os.path.join(root, name)
              if os.path.islink(file_path):
                continue
              result = subprocess.run(
                ["file", file_path],
                capture_output=True,
                text=True,
                check=False,
              )
              output = result.stdout.strip()
              if "Mach-O" not in output:
                continue
              if "arm64" not in output or "x86_64" not in output:
                invalid.append(output)

          if invalid:
            print("::error::The macOS app bundle contains non-universal Mach-O files:")
            for line in invalid[:50]:
              print(line)
            sys.exit(1)
          PY

          # Zip the .app for easy distribution
          ditto -c -k --sequesterRsrc --keepParent "dist/Breakeven_Updater.app" "dist/Breakeven_Updater.app.zip"

      - name: Notarize macOS app bundle
        if: runner.os == 'macOS'
        shell: bash -l {0}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "${MACOS_NOTARIZATION_ENABLED:-false}" != "true" ]; then
            echo "::warning::Skipping notarization for Breakeven_Updater because Apple ID notarization secrets are unavailable."
            exit 0
          fi

          xcrun notarytool submit "dist/Breakeven_Updater.app.zip"             --apple-id "$APPLE_ID"             --password "$APPLE_APP_SPECIFIC_PASSWORD"             --team-id "$APPLE_TEAM_ID"             --wait

          xcrun stapler staple "dist/Breakeven_Updater.app"
          ditto -c -k --sequesterRsrc --keepParent "dist/Breakeven_Updater.app" "dist/Breakeven_Updater.app.zip"

      - name: Clean up macOS signing keychain
        if: runner.os == 'macOS' && always()
        shell: bash -l {0}
        run: |
          if [ -n "${MACOS_KEYCHAIN_PATH:-}" ] && [ -f "$MACOS_KEYCHAIN_PATH" ]; then
            security delete-keychain "$MACOS_KEYCHAIN_PATH" || true
          fi

      - name: Build (Linux AppImage)
        if: runner.os == 'Linux'
        shell: bash -l {0}
        run: |
          python -m PyInstaller --onefile updater.py             --name Breakeven_Updater             --hidden-import psutil             --hidden-import requests             --hidden-import packaging

          # Create AppDir layout
          rm -rf AppDir
          mkdir -p AppDir/usr/bin
          cp dist/Breakeven_Updater AppDir/usr/bin/Breakeven_Updater

          # Desktop entry
          cat > AppDir/Breakeven_Updater.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=Breakeven Updater
          Exec=Breakeven_Updater
          Icon=Breakeven_Updater
          Categories=Utility;
          Terminal=true
          EOF

          # Minimal 1x1 PNG icon (base64)
          base64 -d > AppDir/Breakeven_Updater.png << 'EOF'
          iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVQImWNgYGD4DwABBAEAHnLrWQAAAABJRU5ErkJggg==
          EOF

          # AppRun launcher
          cat > AppDir/AppRun << 'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/Breakeven_Updater" "$@"
          EOF
          chmod +x AppDir/AppRun

          # Package AppImage
          curl -L -o appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool

          # Extract appimagetool (NO FUSE required)
          ./appimagetool --appimage-extract

          # Run the extracted binary
          ./squashfs-root/AppRun AppDir dist/Breakeven_Updater-x86_64.AppImage

          chmod +x dist/Breakeven_Updater-x86_64.AppImage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Breakeven_Updater-${{ matrix.artifact_suffix }}
          path: ${{ matrix.upload_path }}
